<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>DevBoard architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">DevBoard architecture</text>
  <text x="40" y="72" font-size="14" fill="#475569">Solid boxes are built. Dashed boxes are planned.</text>

  <!-- Client -->
  <rect x="40" y="110" width="200" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="140" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Client</text>
  <text x="140" y="164" text-anchor="middle" font-size="13" fill="#334155">Postman / HTTP client</text>
  <text x="140" y="184" text-anchor="middle" font-size="13" fill="#334155">Next.js (planned)</text>

  <!-- Keycloak -->
  <rect x="400" y="110" width="220" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="510" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Keycloak</text>
  <text x="510" y="164" text-anchor="middle" font-size="13" fill="#334155">Identity: login and JWTs</text>
  <text x="510" y="184" text-anchor="middle" font-size="13" fill="#334155">Proves who you are</text>

  <!-- Client to Keycloak -->
  <line x1="240" y1="155" x2="398" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="319" y="144" text-anchor="middle" font-size="12" fill="#475569">1. log in, get JWT</text>

  <!-- Client to API -->
  <path d="M140 200 V228 H360 V248" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="152" y="220" font-size="12" fill="#475569">2. request + Bearer JWT</text>

  <!-- Keycloak to API -->
  <line x1="510" y1="200" x2="510" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="232" font-size="12" fill="#475569">3. verify with public keys (JWKS)</text>

  <!-- API container -->
  <rect x="280" y="250" width="560" height="270" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="300" y="278" font-size="15" font-weight="700" fill="#0f172a">Spring Boot 4 API</text>

  <rect x="300" y="295" width="520" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="560" y="327" text-anchor="middle" font-size="13" fill="#0f172a">Security filter chain: JWT validation, then user provisioning</text>

  <rect x="300" y="362" width="520" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="560" y="394" text-anchor="middle" font-size="13" fill="#0f172a">Controllers, DTOs, services (per-org role checks), repositories</text>

  <rect x="300" y="429" width="520" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="560" y="461" text-anchor="middle" font-size="13" fill="#0f172a">Domain events published after the transaction commits</text>

  <!-- Planned: Redis -->
  <rect x="40" y="290" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="140" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Redis</text>
  <text x="140" y="346" text-anchor="middle" font-size="12" fill="#64748b">task cache, locks (planned)</text>
  <line x1="280" y1="330" x2="242" y2="330" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- Planned: Claude API -->
  <rect x="40" y="400" width="200" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="140" y="434" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Claude API</text>
  <text x="140" y="456" text-anchor="middle" font-size="12" fill="#64748b">standup summaries (planned)</text>
  <line x1="280" y1="440" x2="242" y2="440" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- API to Kafka -->
  <line x1="840" y1="455" x2="918" y2="455" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="879" y="441" text-anchor="middle" font-size="11" fill="#475569">publish</text>

  <!-- Kafka -->
  <rect x="920" y="395" width="240" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1040" y="427" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Apache Kafka</text>
  <text x="1040" y="455" text-anchor="middle" font-size="13" fill="#334155">task-events (3 partitions)</text>
  <text x="1040" y="477" text-anchor="middle" font-size="13" fill="#334155">key = taskId</text>
  <text x="1040" y="499" text-anchor="middle" font-size="13" fill="#334155">task-events.DLT</text>

  <!-- Kafka to consumers -->
  <line x1="975" y1="515" x2="975" y2="568" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1105" y1="515" x2="1105" y2="568" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Consumers -->
  <rect x="920" y="570" width="110" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="975" y="605" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Notification</text>
  <text x="975" y="624" text-anchor="middle" font-size="13" fill="#334155">consumer</text>

  <rect x="1050" y="570" width="110" height="80" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1105" y="605" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Audit</text>
  <text x="1105" y="624" text-anchor="middle" font-size="13" fill="#334155">consumer</text>

  <!-- API to PostgreSQL -->
  <line x1="560" y1="520" x2="560" y2="578" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="572" y="556" font-size="12" fill="#475569">JPA / Hibernate, JOIN FETCH</text>

  <!-- PostgreSQL -->
  <rect x="280" y="580" width="560" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="616" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="560" y="642" text-anchor="middle" font-size="13" fill="#334155">Flyway-managed schema</text>
  <text x="560" y="664" text-anchor="middle" font-size="13" fill="#334155">processed_events keeps the consumers idempotent</text>

  <!-- Consumers to PostgreSQL -->
  <line x1="920" y1="610" x2="842" y2="610" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1105 650 V712 H880 V670 H842" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="742" font-size="12" fill="#64748b">Events are keyed by taskId, so all events for one task stay in order.</text>
</svg>
